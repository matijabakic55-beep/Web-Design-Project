<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games4You — Галерија</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-breadcrumbs"></div>

<main>
  <div class="page-shell">
    <h1 id="pageTitle"></h1>
    <p id="pageIntro" class="mb-4" style="max-width:70ch;"></p>

    <div class="with-sidebar">
      <nav class="side-nav" aria-label="Делови галерије">
        <h2 class="side-title" id="sideNavTitle"></h2>
        <ul>
          <li><a href="#store" id="linkStore"></a></li>
          <li><a href="#games" id="linkGames"></a></li>
          <li><a href="#videos" id="linkVideos"></a></li>
        </ul>
      </nav>

      <div>
        <section id="store">
          <div class="section-title" style="margin-top:0;"><h2 id="storeTitle"></h2><div class="rule"></div></div>
          <div class="gallery-grid" id="storeGrid"></div>
        </section>

        <section id="games">
          <div class="section-title"><h2 id="gamesTitle"></h2><div class="rule"></div></div>
          <div class="gallery-grid" id="gamesGrid"></div>
        </section>

        <section id="videos">
          <div class="section-title"><h2 id="videosTitle"></h2><div class="rule"></div></div>
          <div class="video-grid" id="videosGrid"></div>
        </section>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/gallery.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
