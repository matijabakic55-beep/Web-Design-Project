<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games4You — О нама</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-breadcrumbs"></div>

<main>
  <div class="page-shell">
    <h1 id="pageTitle"></h1>

    <div class="about-grid">
      <div>
        <div class="info-card">
          <h3 id="historyTitle"></h3>
          <p id="historyText" class="mb-0"></p>
        </div>
        <div class="info-card">
          <h3 id="missionTitle"></h3>
          <p id="missionText" class="mb-0"></p>
        </div>
        <div class="info-card">
          <h3 id="awardsTitle"></h3>
          <ul id="awardsList" class="mb-0"></ul>
        </div>
      </div>

      <div>
        <div class="info-card">
          <h3 id="hoursTitle"></h3>
          <ul id="hoursList" class="mb-0"></ul>
        </div>
        <div class="info-card">
          <h3 id="contactTitle"></h3>
          <p id="addressText" class="mb-1"></p>
          <p id="phoneText" class="mb-1"></p>
          <p id="emailText" class="mb-0"></p>
        </div>
        <div class="info-card">
          <h3 id="mapTitle"></h3>
          <div class="map-frame">
            <iframe id="mapFrame" loading="lazy" title="Store location map"
              src="https://www.openstreetmap.org/export/embed.html?bbox=20.3950%2C44.8380%2C20.4080%2C44.8480&layer=mapnik&marker=44.8430%2C20.4010"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/about.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
