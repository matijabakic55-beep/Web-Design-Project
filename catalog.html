<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games4You — Каталог игара</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>
<div id="site-breadcrumbs"></div>

<main>
  <div class="page-shell">
    <h1 id="pageTitle"></h1>
    <p id="pageIntro" class="mb-4" style="max-width:70ch;"></p>

    <div class="with-sidebar">
      <aside class="side-nav" aria-label="Категорије игара">
        <div class="side-title" id="sideNavTitle"></div>
        <a href="catalog.html" data-group="" id="linkAll"></a>
        <a href="catalog.html?group=family" data-group="family" id="linkFamily"></a>
        <a href="catalog.html?group=strategy" data-group="strategy" id="linkStrategy"></a>
        <a href="catalog.html?group=party" data-group="party" id="linkParty"></a>
      </aside>

      <div>
        <div class="filter-bar">
          <div>
            <label for="searchInput">🔎</label>
            <input type="text" id="searchInput" placeholder="">
          </div>
          <div>
            <label for="sortSelect" id="sortLabel"></label>
            <select id="sortSelect">
              <option value="name-asc" id="optNameAsc"></option>
              <option value="name-desc" id="optNameDesc"></option>
              <option value="price-asc" id="optPriceAsc"></option>
              <option value="price-desc" id="optPriceDesc"></option>
            </select>
          </div>
          <div class="ms-auto d-flex align-items-center gap-3">
            <span class="mono" id="resultsCount" style="font-size:0.82rem;color:var(--ink-soft);"></span>
            <button type="button" class="btn btn-g4y-outline btn-sm" id="pdfBtn">📄 <span id="pdfLabel"></span></button>
          </div>
        </div>

        <div class="row g-3" id="gamesGrid"></div>
        <p id="noResults" class="text-center text-muted mt-4" style="display:none;"></p>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="js/catalog.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
